esphome:
  name: temp
  friendly_name: Temperature

esp8266:
  board: nodemcuv2

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: ""

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: dht
    model: DHT22_TYPE2
    pin: D2
    temperature:
      name: "Room Temperature"
    humidity:
      name: "Room Humidity"
    update_interval: 60s

binary_sensor:
  - platform: gpio
    pin: D1
    name: "Motion Sensor"
    device_class: motion

captive_portal:
    